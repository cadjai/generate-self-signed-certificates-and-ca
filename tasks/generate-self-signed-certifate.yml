---
- name: Import tasks to generate self signed ca
  vars:
  ansible.builtin.include_tasks: generate-self-signed-ca.yml

- name: Import tasks to generate private key
  vars:
  ansible.builtin.include_tasks: generate-private-key.yml

- name: Import tasks to generate CA CSR
  vars:
    is_ca_csr: false
  ansible.builtin.include_tasks: generate-csr.yml

- name: Import tasks to generate self signed certificate
  vars:
    is_ca_cert: false
  ansible.builtin.include_tasks: generate-certifate.yml 
